<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><title>'97 Ranger 2.3L 3D Parts</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#15181c;font-family:-apple-system,system-ui,Arial,sans-serif;color:#eee;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%}
#top{position:fixed;top:0;left:0;right:0;padding:6px;padding-top:max(6px,env(safe-area-inset-top));display:flex;gap:6px;overflow-x:auto;background:rgba(15,15,15,.85);-webkit-overflow-scrolling:touch;touch-action:pan-x}
button{flex:0 0 auto;font-size:15px;font-weight:600;padding:12px 14px;border-radius:10px;border:1px solid #555;background:#2b3038;color:#fff;min-height:46px}
button.on{background:#e8792b;border-color:#e8792b;color:#111}
#mode{position:fixed;left:8px;top:70px;font-size:13px;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:8px;pointer-events:none}
#info{position:fixed;left:0;right:0;bottom:0;max-height:52%;overflow-y:auto;background:rgba(18,20,24,.96);border-top:2px solid #e8792b;padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:none;font-size:15px;line-height:1.35;touch-action:pan-y;-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text}
#info h2{margin:0 36px 4px 0;font-size:19px}#info .x{position:absolute;right:8px;top:8px;min-height:40px;padding:6px 12px}
.sys{color:#e8a35b;font-size:13px}.row{margin:6px 0;padding:6px 8px;background:#22262d;border-radius:8px}
.b{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:4px}
.V{background:#2e9d4a;color:#fff}.C{background:#d6a21e;color:#111}.U{background:#b33;color:#fff}
a{color:#7fb7ff}h3{font-size:14px;margin:10px 0 2px;color:#aaa;text-transform:uppercase}
#list{position:fixed;inset:0;top:0;background:#15181c;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#list .hd{padding:8px;display:flex;gap:6px;flex-wrap:wrap}#q{flex:1 1 100%;font-size:17px;padding:12px;border-radius:10px;border:1px solid #555;background:#222;color:#fff}
#filt{display:flex;gap:6px;overflow-x:auto;padding:0 8px 8px;touch-action:pan-x}#filt button{font-size:13px;padding:8px 10px;min-height:38px}
#items{flex:1;overflow-y:auto;padding:0 8px 30px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.it{padding:12px;border-bottom:1px solid #333;font-size:16px}.it small{color:#999;display:block;font-size:12px}
#legend{position:fixed;right:8px;top:70px;font-size:11px;background:rgba(0,0,0,.6);padding:5px 8px;border-radius:8px;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<canvas id="c"></canvas>
<div id="top">
<button id="bList">🔍 Parts</button><button data-t="hood">Hood</button><button data-t="doors">Doors</button><button data-t="body">Body off</button><button data-t="split">Split eng/trans</button><button data-t="xray">X-ray</button><button data-t="explode">Explode</button>
<button data-m="remove">Tap = remove</button><button data-m="bolt">Bolts</button><button id="bUndo">↶ Undo</button><button id="bReset">⟲ Reset</button><button id="bView">Front view</button>
</div>
<div id="mode"></div>
<div id="legend"><span class="b V">V</span> verified <span class="b C">C</span> check fit <span class="b U">U</span> unverified</div>
<div id="info"></div>
<div id="list"><div class="hd"><input id="q" placeholder="Search parts or numbers (e.g. hose, FL-1-A)"><button id="lClose">Close</button></div><div id="filt"></div><div id="items"></div></div>
<script src="data.js"></script>
<script type="module">
import * as THREE from 'three'
import {OrbitControls} from 'three/addons/controls/OrbitControls.js'
const S=0.1, cv=document.getElementById('c')
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2))
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1d2228)
const cam=new THREE.PerspectiveCamera(45,1,0.1,500);cam.position.set(14,10,16)
const ctl=new OrbitControls(cam,cv);ctl.target.set(-5,2.5,0);ctl.enableDamping=true;ctl.screenSpacePanning=true
scene.add(new THREE.HemisphereLight(0xffffff,0x334455,1.1));const dl=new THREE.DirectionalLight(0xffffff,1.4);dl.position.set(10,20,8);scene.add(dl)
const grid=new THREE.GridHelper(40,40,0x444444,0x2a2a2a);scene.add(grid)
const root=new THREE.Group();root.position.x=5;scene.add(root)
const groups={};const GOFF={body:[0,0,0],hood:[0,0,0],doorL:[0,0,0],doorR:[0,0,0]}
for(const g of ['frame','body','hood','doorL','doorR','engine','trans','front','chassis','wheels']){groups[g]=new THREE.Group();root.add(groups[g])}
// hood hinge at rear edge, doors hinge at front edge
const pivots={}
function pivot(name,parent,at){const p=new THREE.Group();p.position.set(at[0]*S,at[1]*S,at[2]*S);parent.add(p);pivots[name]=p;return p}
pivot('hood',groups.body,[-25,47,0]);pivot('doorL',groups.body,[-30,47,-32.5]);pivot('doorR',groups.body,[-30,47,32.5])
groups.body.add(groups.hood);groups.body.add(groups.doorL);groups.body.add(groups.doorR)
const meshes=[],byId={},bolts=[]
function geo(sh){if(sh[0]=='box')return new THREE.BoxGeometry(sh[1]*S,sh[2]*S,sh[3]*S)
 const g=new THREE.CylinderGeometry(sh[1]*S,sh[1]*S,sh[2]*S,24);if(sh[3]=='x')g.rotateZ(Math.PI/2);if(sh[3]=='z')g.rotateX(Math.PI/2);return g}
for(const p of PARTS){
 const m=new THREE.Mesh(geo(p.shape),new THREE.MeshStandardMaterial({color:p.col,roughness:.6,metalness:.25,transparent:true}))
 let parent=groups[p.grp]
 if(pivots[p.grp]){parent=pivots[p.grp];const pv=parent.position;m.position.set(p.pos[0]*S-pv.x,p.pos[1]*S-pv.y,p.pos[2]*S-pv.z)} else m.position.set(p.pos[0]*S,p.pos[1]*S,p.pos[2]*S)
 m.userData={pid:p.id,base:m.position.clone(),inner:p.sys=='eng'&&!['block','head','valvecover','oilpan','frontcover','crankpulley','oilfilter','mountR'].includes(p.id)}
 parent.add(m);meshes.push(m);byId[p.id]=m
 if(p.bolts&&p.bolts.n){const bb=new THREE.Box3().setFromObject(m);const sz=bb.getSize(new THREE.Vector3())
  for(let i=0;i<Math.min(p.bolts.n,16);i++){const b=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.12,6),new THREE.MeshStandardMaterial({color:0xffd23f,metalness:.8,roughness:.3}))
   const t=(i+.5)/Math.min(p.bolts.n,16);b.position.set(m.position.x+(t-.5)*sz.x*.9,m.position.y+sz.y/2+.04,m.position.z+(i%2?1:-1)*sz.z*.3)
   b.userData={bolt:p.id,idx:i,base:b.position.clone()};b.visible=false;parent.add(b);bolts.push(b)}}
}
// ---- state ----
const st={hood:0,doors:0,body:0,split:0,xray:0,explode:0}, anim={hood:0,doors:0,body:0,split:0,explode:0}
let mode='info',sel=null;const undo=[]
const $=s=>document.querySelector(s)
function setT(k,v,rec=true){if(rec)undo.push({t:'tog',k,v:st[k]});st[k]=v;document.querySelectorAll(`[data-t=${k}]`).forEach(b=>b.classList.toggle('on',!!v));if(k=='xray')applyXray()}
function applyXray(){for(const m of meshes){const p=m.userData;m.material.opacity=st.xray&&!p.inner&&p.pid!==sel?.id?.15:1;m.material.depthWrite=!(st.xray&&!p.inner)}}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setT(b.dataset.t,st[b.dataset.t]?0:1))
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(mode==b.dataset.m?'info':b.dataset.m))
function setMode(m){mode=m;document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m==m));for(const b of bolts)b.visible=m=='bolt'&&!b.userData.gone&&byId[b.userData.bolt].visible
 $('#mode').textContent={info:'Tap a part for numbers & specs',remove:'REMOVE mode: tap a part to pull it off',bolt:'BOLT mode: yellow = bolts. Tap to remove + see spec'}[m]}
setMode('info')
$('#bUndo').onclick=()=>{const a=undo.pop();if(!a)return;if(a.t=='tog')setT(a.k,a.v,false);if(a.t=='rm'){a.o.visible=true;a.o.userData.gone=false;if(a.o.userData.bolt)a.o.visible=mode=='bolt'}}
$('#bReset').onclick=()=>{for(const k in st)setT(k,0,false);for(const m of meshes){m.visible=true;m.userData.gone=false}for(const b of bolts){b.userData.gone=false}undo.length=0;setMode('info');hide();ctl.target.set(-5,2.5,0);cam.position.set(14,10,16)}
let vw=0;$('#bView').onclick=()=>{const V=[[[14,10,16],'Front view'],[[22,6,0],'Side view'],[[3,14,0.1],'Top view'],[[-25,8,10],'Rear view']];vw=(vw+1)%4;cam.position.set(...V[vw][0]);$('#bView').textContent=V[(vw+1)%4][1]}
// ---- info panel ----
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))
const src=k=>k&&SRC[k]?` <a href="${SRC[k][1]}" target="_blank" rel="noopener">source</a>`:''
const badge=s=>`<span class="b ${s}">${{V:'verified',C:'check fit',U:'unverified'}[s]}</span>`
function show(p,boltIdx){sel=p;const i=$('#info');let h=`<button class="x" id="ix">✕</button><h2>${esc(p.n)}</h2><div class="sys">${SYS[p.sys]} · 1997 Ranger 2.3L auto</div>`
 h+='<h3>Ford / Motorcraft numbers</h3>'+(p.oem.length?p.oem.map(o=>`<div class="row"><b>${esc(o.n)}</b>${badge(o.st)}<br><small>${esc(o.d)}</small>${src(o.src)}</div>`).join(''):`<div class="row">None confirmed yet ${badge('U')}</div>`)
 if(p.am.length)h+='<h3>Aftermarket</h3>'+p.am.map(o=>`<div class="row"><b>${esc(o.n)}</b>${badge(o.st)}<br><small>${esc(o.d)}</small>${src(o.src)}</div>`).join('')
 h+='<h3>Dimensions</h3>'+(p.dim?`<div class="row">${esc(p.dim.t)} ${badge(p.dim.st)}${src(p.dim.src)}</div>`:`<div class="row">Not confirmed ${badge('U')}</div>`)
 h+='<h3>Bolts / torque</h3>'+(p.bolts?`<div class="row">${boltIdx!=null?`<b>Bolt #${boltIdx+1} removed.</b><br>`:''}${esc(p.bolts.d)}<br><b>${esc(p.bolts.sp)}</b> ${badge(p.bolts.st)}${src(p.bolts.src)}</div>`:`<div class="row">Not confirmed ${badge('U')}</div>`)
 if(p.tips.length)h+='<h3>Tips</h3>'+p.tips.map(t=>`<div class="row">💡 ${esc(t.t)}${src(t.src)}</div>`).join('')
 h+=`<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button id="iRm">Remove part</button><button id="iFoc">Zoom to it</button></div><p style="font-size:12px;color:#999">Always confirm numbers with your VIN at the parts counter. 3D shapes are simplified.</p>`
 i.innerHTML=h;i.style.display='block';$('#ix').onclick=hide;$('#iRm').onclick=()=>{remove(byId[p.id]);hide()};$('#iFoc').onclick=()=>focus(byId[p.id])
 for(const m of meshes)m.material.emissive?.setHex(m.userData.pid==p.id?0x553300:0);applyXray()}
function hide(){$('#info').style.display='none';sel=null;for(const m of meshes)m.material.emissive.setHex(0);applyXray()}
function remove(o){if(!o.visible)return;o.visible=false;o.userData.gone=true;undo.push({t:'rm',o})}
function focus(m){const p=new THREE.Vector3();m.getWorldPosition(p);ctl.target.copy(p);const d=cam.position.clone().sub(p).setLength(5);cam.position.copy(p).add(d)}
// ---- picking ----
const ray=new THREE.Raycaster();let down=null
cv.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY,t:performance.now()})
cv.addEventListener('pointerup',e=>{if(!down)return;const mv=Math.hypot(e.clientX-down.x,e.clientY-down.y);if(mv<10&&performance.now()-down.t<600)tapAt(e.clientX,e.clientY);down=null})
function pick(x,y){ray.setFromCamera(new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1),cam)
 const cands=(mode=='bolt'?bolts:[]).concat(meshes).filter(o=>o.visible&&(!st.xray||mode=='bolt'||o.userData.inner||o.userData.bolt||!st.xray))
 let hits=ray.intersectObjects(cands,false);if(st.xray&&mode!='bolt'){const inn=hits.filter(h=>h.object.userData.inner);if(inn.length)hits=inn}return hits[0]?.object}
function tapAt(x,y){const o=pick(x,y);if(!o){hide();return}
 if(o.userData.bolt!=null){remove(o);show(PARTS.find(p=>p.id==o.userData.bolt),o.userData.idx);return}
 const p=PARTS.find(q=>q.id==o.userData.pid);if(mode=='remove'){remove(o);for(const b of bolts)if(b.userData.bolt==p.id)b.visible=false}else show(p)}
// ---- list ----
let filt='all';const F=$('#filt');F.innerHTML=`<button data-f="all" class="on">All</button>`+Object.entries(SYS).map(([k,v])=>`<button data-f="${k}">${v}</button>`).join('')
F.onclick=e=>{const f=e.target.dataset.f;if(!f)return;filt=f;F.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f==f));renderList()}
function renderList(){const q=$('#q').value.toLowerCase();$('#items').innerHTML=PARTS.filter(p=>(filt=='all'||p.sys==filt)&&(!q||(p.n+' '+p.oem.map(o=>o.n+' '+o.d).join(' ')+p.am.map(o=>o.n).join(' ')).toLowerCase().includes(q))).map(p=>{const best=p.oem.find(o=>o.st=='V')||p.oem[0];return `<div class="it" data-id="${p.id}">${esc(p.n)} ${best?badge(best.st):badge('U')}<small>${SYS[p.sys]}${best?' · '+esc(best.n):''}</small></div>`}).join('')}
$('#q').oninput=renderList;$('#bList').onclick=()=>{$('#list').style.display='flex';renderList()};$('#lClose').onclick=()=>$('#list').style.display='none'
$('#items').onclick=e=>{const d=e.target.closest('.it');if(!d)return;$('#list').style.display='none';const m=byId[d.dataset.id];m.visible=true;m.userData.gone=false;focus(m);show(PARTS.find(p=>p.id==d.dataset.id))}
// ---- animate ----
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize()
const L=(a,b)=>a+(b-a)*.12
function loop(){requestAnimationFrame(loop);for(const k in anim)anim[k]=L(anim[k],st[k])
 pivots.hood.rotation.z=anim.hood*1.0;pivots.doorL.rotation.y=-anim.doors*1.1;pivots.doorR.rotation.y=anim.doors*1.1
 groups.body.position.y=anim.body*5;groups.body.position.z=anim.body*9
 groups.engine.position.x=anim.split*2.5;groups.trans.position.x=-anim.split*1.5;groups.trans.position.y=anim.split*0
 for(const m of meshes){const p=PARTS.find(q=>q.id==m.userData.pid);if(p.sys=='eng'||p.grp=='engine'){const e=anim.explode;m.position.set(m.userData.base.x+(m.userData.base.x+0.6)*e*.6,m.userData.base.y+(m.userData.base.y-2.6)*e*1.2,m.userData.base.z+m.userData.base.z*e*1.2)}}
 ctl.update();R.render(scene,cam)}
loop()
window.app={st,setT,setMode,show,hide,PARTS,byId,bolts,meshes,cam,ctl,tapAt,pick,undo,remove,focus,stats:()=>{const c={V:0,C:0,U:0};for(const p of PARTS){const s=p.oem.some(o=>o.st=='V')?'V':p.oem.some(o=>o.st=='C')?'C':'U';c[s]++}return c}}
</script></body></html>
