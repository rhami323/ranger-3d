const mesh=(g,m,cast=true)=>{const o=new THREE.Mesh(g,m);o.castShadow=cast;o.receiveShadow=true;return o}

function hexBolt(af=.55,len=1.2){const r=af/2/Math.cos(Math.PI/6);const parts=[]

 const ch=new THREE.CylinderGeometry(r*.6,r*.92,af*.12,6);ch.translate(0,af*.55+.05+af*.06,0);parts.push(ch)
 const fl=new THREE.CylinderGeometry(r*1.15,r*1.15,.08,24);fl.translate(0,.04,0);parts.push(fl)
 const sh=new THREE.CylinderGeometry(af*.33,af*.33,len,16);sh.translate(0,-len/2,0);parts.push(sh)

 h+='<h3>Ford / Motorcraft numbers</h3>'+(p.oem.length?p.oem.map(o=>`<div class="row"><b>${esc(o.n)}</b>${badge(o.st)}<br><small>${esc(o.d)}</small>${src(o.src)}</div>`).join(''):`<div class="row">None confirmed yet ${badge('U')}</div>`)
 if(p.am.length)h+='<h3>Aftermarket</h3>'+p.am.map(o=>`<div class="row"><b>${esc(o.n)}</b>${badge(o.st)}<br><small>${esc(o.d)}</small>${src(o.src)}</div>`).join('')
 h+='<h3>Dimensions</h3>'+(p.dim?`<div class="row">${esc(p.dim.t)} ${badge(p.dim.st)}${src(p.dim.src)}</div>`:`<div class="row">Not confirmed ${badge('U')}</div>`)
 h+='<h3>Bolts / torque</h3>'+(p.bolts?`<div class="row">${boltIdx!=null?`<b>${kind=='nut'?'Nut':'Bolt'} #${boltIdx+1} removed.</b> (3D fastener shape is generic; size unverified)<br>`:''}${esc(p.bolts.d)}<br><b>${esc(p.bolts.sp)}</b> ${badge(p.bolts.st)}${src(p.bolts.src)}</div>`:`<div class="row">Not confirmed ${badge('U')}</div>`)
 if(p.label)h+=`<h3>Label read</h3><div class="row">🏷️ ${esc(p.label)}</div>`
 if(p.geo)h+='<h3>3D position & appearance sources</h3>'+p.geo.map(t=>`<div class="row">📐 ${esc(t.t)}${src(t.src)}</div>`).join('')
 if(p.tips.length)h+='<h3>Tips</h3>'+p.tips.map(t=>`<div class="row">💡 ${esc(t.t)}${src(t.src)}</div>`).join('')
 h+=`<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">${p.nogeo?'':'<button id="iRm">Remove part</button><button id="iFoc">Zoom to it</button>'}</div><p style="font-size:12px;color:#999">Always confirm numbers with your VIN at the parts counter. 3D shapes are hand-modelled approximations, not factory CAD.</p>`
 i.innerHTML=h;i.style.display='block';$('#ix').onclick=hide;if(!p.nogeo){$('#iRm').onclick=()=>{remove(byId[p.id]);hide()};$('#iFoc').onclick=()=>focus(byId[p.id])}
 for(const o of meshes)each(o,c=>c.material.emissive?.setHex(o.userData.pid==p.id?0x663300:0));applyXray()}
function hide(){$('#info').style.display='none';sel=null;for(const o of meshes)each(o,c=>c.material.emissive?.setHex(0));applyXray()}
function remove(o){if(!o||!o.visible)return;o.visible=false;o.userData.gone=true;undo.push({t:'rm',o});sceneChanged()}
function focus(m){if(!m)return;const p=new THREE.Vector3();new THREE.Box3().setFromObject(m).getCenter(p);ctl.target.copy(p);const d=cam.position.clone().sub(p).setLength(6);cam.position.copy(p).add(d)}
// ---- picking ----
const ray=new THREE.Raycaster();let down=null
cv.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY,t:performance.now()})
cv.addEventListener('pointerup',e=>{if(!down)return;const mv=Math.hypot(e.clientX-down.x,e.clientY-down.y);if(mv<10&&performance.now()-down.t<600)tapAt(e.clientX,e.clientY);down=null})
const top=o=>{while(o&&o.userData.pid==null&&o.userData.bolt==null)o=o.parent;while(o&&o.parent&&!meshes.includes(o)&&!bolts.includes(o))o=o.parent;return o}
function vis(o){while(o){if(!o.visible)return false;o=o.parent}return true}
function pick(x,y){ray.setFromCamera(new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1),cam)
 const cands=(mode=='bolt'?bolts.filter(b=>b.visible):[]).concat(meshes.filter(vis))
 let hits=ray.intersectObjects(cands,true).filter(h=>vis(h.object));let tops=hits.map(h=>top(h.object)).filter(Boolean)
 if(mode=='bolt'){const b=tops.find(t=>t.userData.bolt!=null);if(b)return b}
 if(st.xray){const inn=tops.filter(t=>t.userData.inner);if(inn.length)return inn[0]}return tops[0]}
function tapAt(x,y){const o=pick(x,y);if(!o){hide();return}
 if(o.userData.bolt!=null){remove(o);show(PARTS.find(p=>p.id==o.userData.bolt),o.userData.idx,o.userData.kind);return}
 const p=PARTS.find(q=>q.id==o.userData.pid);if(mode=='remove'){remove(o);for(const b of bolts)if(b.userData.bolt==p.id)b.visible=false}else show(p)}
// ---- list ----
let filt='all';const F=$('#filt');F.innerHTML=`<button data-f="all" class="on">All</button>`+Object.entries(SYS).map(([k,v])=>`<button data-f="${k}">${v}</button>`).join('')
F.onclick=e=>{const f=e.target.dataset.f;if(!f)return;filt=f;F.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f==f));renderList()}
function renderList(){const q=$('#q').value.toLowerCase();$('#items').innerHTML=PARTS.filter(p=>(filt=='all'||p.sys==filt)&&(!q||(p.n+' '+p.oem.map(o=>o.n+' '+o.d).join(' ')+p.am.map(o=>o.n).join(' ')).toLowerCase().includes(q))).map(p=>{const best=p.oem.find(o=>o.st=='V')||p.oem[0];return `<div class="it" data-id="${p.id}">${esc(p.n)} ${best?badge(best.st):badge('U')}<small>${SYS[p.sys]}${best?' · '+esc(best.n):''}${p.nogeo?' · data only (no 3D)':''}</small></div>`}).join('')}
$('#q').oninput=renderList;$('#bList').onclick=()=>{$('#list').style.display='flex';renderList()};$('#lClose').onclick=()=>$('#list').style.display='none'
$('#items').onclick=e=>{const d=e.target.closest('.it');if(!d)return;$('#list').style.display='none';const m=byId[d.dataset.id];if(m){m.visible=true;m.userData.gone=false;focus(m)}show(PARTS.find(p=>p.id==d.dataset.id));sceneChanged()}
// ---- animate ----
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();sceneChanged()}addEventListener('resize',resize);resize()
const L=(a,b)=>Math.abs(b-a)<1e-3?b:a+(b-a)*.12
const PB={};for(const o of meshes)PB[o.userData.pid]=PARTS.find(q=>q.id==o.userData.pid)
let lastMode=''
function loop(){requestAnimationFrame(loop);let moving=false;for(const k in anim){const n=L(anim[k],st[k]);if(n!==anim[k])moving=true;anim[k]=n}
 pivots.hood.rotation.z=anim.hood*0.95;pivots.doorL.rotation.y=-anim.doors*1.1;pivots.doorR.rotation.y=anim.doors*1.1
 groups.body.position.y=anim.body*5;groups.body.position.z=anim.body*9
 groups.engine.position.x=anim.split*2.5;groups.trans.position.x=-anim.split*1.5
 for(const m of meshes){const p=PB[m.userData.pid];if(p.grp=='engine'){const e=anim.explode,b=m.userData.base;m.position.set(b.x+(b.x+0.6)*e*.6,b.y+(b.y-2.6)*e*1.2,b.z+b.z*e*1.2)}}
 ctl.update();lastMode=render(moving)}
loop()
window.app={st,setT,setMode,show,hide,PARTS,byId,bolts,meshes,cam,ctl,tapAt,pick,undo,remove,focus,R,scene,setPT,mode:()=>lastMode,stats:()=>{const c={V:0,C:0,U:0};for(const p of PARTS){const s=p.oem.some(o=>o.st=='V')?'V':p.oem.some(o=>o.st=='C')?'C':'U';c[s]++}return c}}

</script></body></html>
